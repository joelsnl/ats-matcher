[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-matcher"
version = "0.2.0"
description = "Local ATS CV parser and multi-source job matcher (llama.cpp)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ATS Matcher" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "ftfy>=6.2",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3.2"]
dev = ["pytest>=8.0", "reportlab>=4.2"]
indeed = ["python-jobspy>=1.1.82,<2"]

[project.scripts]
ats-match = "ats_matcher.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ats_matcher.jobs" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "llm: tests that load a local GGUF via llama.cpp",
    "live: tests that hit the network",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
